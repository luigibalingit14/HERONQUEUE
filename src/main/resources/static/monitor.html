<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HeronQueue | Queue display</title>
  <link rel="stylesheet" href="assets/theme.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="monitor-page">
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="assets/logos/PNGs/UMak Logo - White R.png" alt="University of Makati logo">
      <span class="brand-copy"><strong>HERONQUEUE</strong><small>University of Makati</small></span>
    </div>
    <div class="monitor-heading">
      <span class="eyebrow">Queue display</span>
      <span class="monitor-clock" id="monitorClock"></span>
    </div>
  </header>
  <main class="monitor-shell">
    <section class="monitor-hero">
      <div class="eyebrow">Now serving</div>
      <div class="monitor-ticket" id="monitorCurrent">—</div>
      <p>Please proceed to the service desk when your number is called.</p>
    </section>
    <section class="monitor-stats">
      <div class="monitor-stat">
        <span class="material-symbols-outlined">groups</span>
        <div><small>Waiting now</small><strong id="monitorWaitingCount">0</strong></div>
      </div>
      <div class="monitor-stat">
        <span class="material-symbols-outlined">schedule</span>
        <div><small>Queue status</small><strong id="monitorStatus">Open</strong></div>
      </div>
    </section>
    <section class="monitor-queue-card">
      <div class="monitor-queue-header">
        <div><div class="eyebrow">Up next</div><h1>Tickets in line</h1></div>
        <span class="status-chip"><i class="live-dot"></i> Live queue</span>
      </div>
      <div class="monitor-queue-list" id="monitorQueue">
        <div class="monitor-empty">No waiting tickets.</div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>

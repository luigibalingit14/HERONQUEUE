services:
  - type: web
    name: heronqueue
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /kiosk.html
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SUPABASE_JDBC_URL
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
